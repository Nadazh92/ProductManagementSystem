<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/style.css">
    <script src="main.js" defer></script>
    <title>Product Management System</title>
</head>
<body>
    <main>
        <h1>Product Management System</h1>
     

        <div class="input">
            <h2>Add New Product</h2>
            <p>Fill in the product details below</p>

            <input type="number" placeholder="ID" name="ID" id="ID">
            <input type="text" placeholder="Enter product name" name="Proname" id="Proname">
            <select name="category" id="category">
                <option value="women">Women</option>
                <option value="men">Men</option>
                <option value="kids">Kids</option>
            </select>
            <input type="number" placeholder="Enter price" name="price" id="price">
            <input type="number" placeholder="Enter stock quantity" name="stockQnty" id="StockQnty">
            <textarea name="description" id="description" placeholder="Enter prodcut description"></textarea>

            <input type="text" placeholder="Enter Image url" name="imgUrl" id="imgUrl">
            <select name="status" id="status">
                 <option value="Active">Ative</option>
                <option value="nonActive">Non Active</option>
            </select>

            <button id="savePro">Save Product</button>
            
        </div>
    </main>
    
</body>
</html>
